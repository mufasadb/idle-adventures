<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Idle Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* kml: "Gothic Obsidian" — near-black panels, thin tarnished-gold rules, a carved
         serif for headings, a book serif for text. Kept deliberately sparse. */
      :root {
        color-scheme: dark;
        --bg: #09090b; --panel: #111114; --panel-2: #17171b; --line: #2a2620;
        --gold: #c9a55a; --gold-dim: #6f5a31; --text: #e6dfcf; --muted: #8e8676;
        --red: #b0392f; --green: #6aa04f; --blue: #7fa6d6;
        --handle: 44px;
      }
      body { font-family: "Crimson Pro", Georgia, serif; font-size: 17px; background: var(--bg); color: var(--text); padding: 1rem; margin: 0; font-variant-numeric: tabular-nums; }
      body.in-expedition { padding: 0; overflow: hidden; height: 100dvh; }
      h1 { font-family: "Cinzel", Georgia, serif; font-size: 1.25rem; margin: 0; color: var(--gold); letter-spacing: 0.04em; font-weight: 500; }
      h2 { font-family: "Cinzel", Georgia, serif; font-size: 0.85rem; margin: 1rem 0 0.4rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
      header { display: flex; align-items: baseline; gap: 0.75rem; border-bottom: 1px solid var(--gold-dim); padding-bottom: 0.5rem; }
      .muted { color: var(--muted); }
      .small { font-size: 0.8rem; }
      .cols { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; margin-top: 0.75rem; }
      section { min-width: 220px; }
      .mapwrap { min-width: unset; }

      button { font-family: inherit; font-size: 0.95rem; background: var(--panel-2); color: var(--text); border: 1px solid var(--gold-dim); border-radius: 3px; padding: 0.3rem 0.7rem; cursor: pointer; }
      button:hover { border-color: var(--gold); color: #fff; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #2a2214; border-color: var(--gold); color: var(--gold); font-weight: 600; }
      button.link { background: none; border: none; color: var(--blue); padding: 0 0.2rem; }

      /* grid */
      .grid { display: grid; gap: 1px; background: #0e0e12; padding: 2px; width: max-content; border-radius: 4px; }
      .gridscroll { max-height: 72vh; overflow-y: auto; width: max-content; max-width: 100%; overflow-x: auto; border-radius: 4px; }
      .tile { width: 1.4rem; height: 1.4rem; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; user-select: none; position: relative; }
      .terrain-plains { background: #3f5c33; }
      .terrain-mud { background: #52422e; }
      .terrain-river { background: #295080; }
      .terrain-ice { background: #8fb8cc; color: #223; }
      .terrain-mountain { background: #5c5c63; }
      .terrain-shallows { background: #4a7a8c; }
      .terrain-lake { background: #1d3f63; }
      .terrain-sea { background: #12304f; }
      .terrain-lake.deep, .terrain-sea.deep { background: #0e2640; }
      .tile.fished { filter: saturate(0.4) brightness(0.8); }
      .poi { font-weight: bold; color: var(--gold); }
      .poi.locked { color: #8a7a3a; } /* visible but tier-locked */
      /* wzx: a humanoid camp (the map-dropper) — a landmark visible at any range so you can pick a heading toward the map economy. Teal ring + the 'C' glyph (non-trial). */
      .tile.landmark-camp { box-shadow: inset 0 0 0 2px #35c2b0; border-radius: 3px; }
      .tile.landmark-camp.poi { color: #6fe0d0; }
      /* cww: a resolved forage node tinted by its material — flint/deadwood pop against the herb yellow so the bootstrap tool-materials are legible at a glance. */
      .grid .tile.poi.mat-flint { color: #cfe0ea; }    /* pale stone */
      .grid .tile.poi.mat-deadwood { color: #d9a662; } /* dry wood */
      .grid .tile.poi.mat-berries { color: #e07a97; }  /* berry red */
      .player { color: #fff; background: #8e2a22 !important; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--gold); }
      .tile { cursor: pointer; }
      .tile:hover { outline: 2px solid #8ab4ff; outline-offset: -2px; }
      .tile.path { box-shadow: inset 0 0 0 2px #8ab4ff88; background-image: radial-gradient(#8ab4ff55 40%, transparent 42%); }
      .tile.path-transport { box-shadow: inset 0 0 0 2px #4a90d9; }  /* transport-cheapened */
      .tile.path-tool { box-shadow: inset 0 0 0 2px #48c774; }        /* gear-discounted */
      .tile.path-enabled { box-shadow: inset 0 0 0 2px #f0a020; }     /* climbing-pick unlocked */
      .tile.path-goal { outline: 2px solid var(--gold); outline-offset: -2px; }
      /* eot: a leg crossing impassable terrain — the red "this won't work" marker */
      .tile.path-blocked { box-shadow: inset 0 0 0 2px #ff3b3b; background-image: radial-gradient(#ff3b3b88 45%, transparent 47%); }
      .tile.path-blocked::after { content: "✗"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff5b5b; font-weight: bold; pointer-events: none; }
      /* eot: a player-placed waypoint (a leg endpoint) */
      .tile.path-waypoint { outline: 2px dashed #8ab4ff; outline-offset: -2px; }
      .pathbanner.blocked { color: #ff9b9b; }
      .pathbanner { font-size: 0.82rem; margin: 0.4rem 0; min-height: 1.2rem; }
      /* 48l.10 approved atlas: pixel-art tiles + ¾ billboard sprites */
      .grid.atlas-assets .tile { width: 32px; height: 32px; font-size: 0; background-size: auto; background-repeat: no-repeat; image-rendering: pixelated; position: relative; }
      .grid.atlas-assets .tile .sprite { position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); image-rendering: pixelated; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
      .grid.atlas-assets .tile .nodeicon { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; background-repeat: no-repeat; pointer-events: none; z-index: 2; filter: drop-shadow(0 1px 1px #000a); }
      .grid.atlas-assets .tile.player { font-size: 20px; color: var(--gold); text-shadow: 0 0 3px #000, 0 0 3px #000; z-index: 3; }
      .grid.atlas-assets .tile.poi { color: var(--gold); text-shadow: 0 0 3px #000; }
      /* cww: in sprite mode a resolved forage material shows its LETTER (no material icon exists yet) — the generic herb icon is suppressed, so make the f/d/b visible + material-coloured (beats the .poi gold above by source order at equal specificity). */
      .grid.atlas-assets .tile.poi.mat-flint,
      .grid.atlas-assets .tile.poi.mat-deadwood,
      .grid.atlas-assets .tile.poi.mat-berries { font-size: 18px; font-weight: bold; }
      .grid.atlas-assets .tile.poi.mat-flint { color: #cfe0ea; }
      .grid.atlas-assets .tile.poi.mat-deadwood { color: #d9a662; }
      .grid.atlas-assets .tile.poi.mat-berries { color: #e07a97; }
      .pathbanner .over { color: #ff6b6b; } /* route costs more energy than you have */
      .pathbanner.engaged { color: #ffb454; font-weight: 600; } /* a fight is live — point at the panel */

      /* current-tile "Here" panel */
      .here { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 5px; padding: 0.5rem 0.7rem; margin-bottom: 0.6rem; font-size: 0.85rem; line-height: 1.5; }
      .here.monster { border-left-color: #c03838; }
      .here.locked { border-left-color: #8a7a3a; }
      .here button { margin-left: 0.4rem; }
      .here .tier { background: #4a3a1a; color: var(--gold); border-radius: 3px; padding: 0 0.3rem; font-size: 0.75rem; }
      .here .forecast { font-size: 0.8rem; color: #b8b8c8; margin-top: 0.3rem; }
      .forecast .good { color: #6bbf59; }
      .forecast .over { color: #ff6b6b; }
      .forecast .was { color: #d9a441; font-size: 0.72rem; } /* 67e: damage-change delta ("was N") after a coat/swap/potion */
      .engagement .forecast { margin: 0.4rem 0; }

      /* slot strip — supplies vs loot vs empty */
      .slots { display: flex; flex-wrap: wrap; gap: 3px; margin: 0.3rem 0; }
      .slot { min-width: 3.2rem; height: 2rem; border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.62rem; line-height: 1.1; text-align: center; padding: 0 0.2rem; }
      .slot .q { color: #b8b8c0; font-size: 0.6rem; }
      .slot .slot-icon { display: block; image-rendering: pixelated; background-repeat: no-repeat; transform: scale(1.25); transform-origin: center; }
      .slot:has(.slot-icon) { min-width: 2.4rem; height: 2.4rem; position: relative; }
      .slot:has(.slot-icon) .q { position: absolute; right: 2px; bottom: 1px; font-size: 0.7rem; color: var(--text); text-shadow: 0 0 2px #000; }
      .slot.empty { color: #45454f; border-style: dashed; }
      .slot.food { background: #2c3320; border-color: #4a5a2e; color: #b9d08a; }
      .slot[data-eatfood] { cursor: context-menu; } /* mco: right-click to designate auto-eat food */
      .slot.food.designated { border: 2px solid #cfe08a; box-shadow: 0 0 0 1px #cfe08a55; position: relative; } /* designated auto-eat food */
      .slot .autoeat { position: absolute; top: -0.5rem; right: -0.4rem; font-size: 0.72rem; } /* 🍴 badge */
      /* 7lr: a food you can eat now is clickable; a camp-meal-ready eat glows teal (over-max + 50%) */
      .slot.food.eatable { cursor: pointer; }
      .slot.food.eatable:hover { border-color: #cfe08a; }
      .slot.food.campmeal:hover { border-color: #35c2b0; box-shadow: 0 0 0 1px #35c2b088; }
      .campmeal-badge { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
      .campmeal-badge.ready { background: #14332e; color: #6fe0d0; border: 1px solid #35c2b0; }
      .campmeal-badge.spent { background: var(--panel-2); color: #7a7a86; border: 1px solid #3a3a44; }
      .slot.potion { background: #2a2233; border-color: #5a3e6a; color: #d0a8e0; }
      .slot.battle { background: #331e1e; border-color: #6a2e2e; color: #e69a9a; }
      .slot.ammo { background: #2e281c; border-color: #6a582e; color: #e0c488; } /* arrows (D45): amber quiver */
      .slot.tool { background: var(--panel-2); border-color: #4a4a56; color: #b0b0bc; }
      .slot.loot { background: #33301e; border-color: #6a5e2e; color: var(--gold); }
      .slot.ghost { border-style: dashed; border-color: #3a3a46; color: #6a6a78; opacity: 0.6; font-style: italic; }
      .slots.ghosts { margin-top: 2px; padding-top: 3px; border-top: 1px dotted #2c2c34; }
      .pathbanner button[data-walk] { font-weight: bold; }

      /* panels */
      .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.1rem 0; border-bottom: 1px solid var(--line); }
      .k { color: var(--muted); } .v { text-align: right; }
      .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0.05rem 0.35rem; font-size: 0.8rem; white-space: nowrap; }
      .bank, .craftlist, .actions { display: flex; flex-direction: column; gap: 0.3rem; }
      .actions { flex-direction: row; flex-wrap: wrap; }
      .bankitem, .mapcard { display: flex; align-items: center; gap: 0.5rem; }
      .mapcard { background: var(--panel-2); border: 1px solid #333; border-radius: 5px; padding: 0.5rem 0.7rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
      .mapcard b { text-transform: capitalize; min-width: 5rem; }
      .mapoffer { display: flex; flex-direction: column; gap: 0.2rem; }
      /* zpm.3: free local map (renewable, green) vs earned map (valued, tarnished gold) */
      .mapcard.local { border-left: 3px solid #4f9c78; }
      .mapcard.earned { border-left: 3px solid #b8933f; background: #262019; }
      .mapcard .muted.small { flex-basis: 100%; }
      .maptag { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.05rem 0.4rem; border-radius: 999px; font-weight: 600; white-space: nowrap; }
      .maptag.free { background: #1a2c23; color: #7fd6a8; border: 1px solid #2f5a45; }
      .maptag.tier { background: #2e2612; color: #e0b45e; border: 1px solid #6b551f; }
      .mapgroup { font-size: 0.95rem; margin: 0.85rem 0 0.3rem; }
      /* zpm.3: two-step prep banner */
      .prepbar { display: flex; align-items: center; gap: 1rem; justify-content: space-between; flex-wrap: wrap; background: var(--panel-2); border: 1px solid #3a3a46; border-radius: 6px; padding: 0.6rem 0.9rem; margin-top: 0.75rem; }
      .prephead { flex: 1; min-width: 12rem; text-transform: capitalize; }
      .prephead .maptag { margin-left: 0.35rem; }
      button.embark-final { background: #2f6b45; color: #eafff2; border: 1px solid #3f8a5a; font-weight: 600; padding: 0.45rem 1.1rem; border-radius: 5px; font-size: 0.95rem; }
      button.embark-final:hover { background: #3a8256; }
      .craftgroup { display: flex; flex-direction: column; gap: 0.15rem; }
      .craftgroup .craftname { font-weight: 600; }
      .craftpath { margin-left: 0.9rem; font-size: 0.78rem; color: #b8b8c8; display: flex; align-items: center; gap: 0.4rem; }
      .craftpath.locked { opacity: 0.55; }
      .craftgroup.locked > .craftname { opacity: 0.6; }
      .warn { color: #ff9a5e; font-size: 0.75rem; }

      /* bars */
      .bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; font-size: 0.85rem; }
      .bar span { width: 3.5rem; color: var(--muted); }
      .track { width: 220px; height: 0.7rem; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: flex; }
      .fill { height: 100%; }
      .fill.energy { background: #6bbf59; }
      .fill.spend { background: #d98a2b; }        /* a pending walk will spend this much */
      .fill.spend.over { background: #c03838; }    /* the walk would strand you (cost > energy) */
      .overfull { color: #6bbf59; font-weight: 600; } /* over-full stamina surplus after a manual over-eat (m0a) — distinct class so it can't tint any .over danger text */
      .fill.hp { background: #c03838; }
      .fill.monster { background: #c0504d; }

      /* log */
      .logbox { width: 100%; margin-top: 1rem; border-top: 1px solid var(--line); }
      .logline { font-size: 0.82rem; padding: 0.1rem 0; border-bottom: 1px dotted var(--panel-2); }

      /* ===== kml: landscape-first expedition layout ===== */
      .exp { position: fixed; inset: 0; display: flex; flex-direction: column; }
      .viewport { position: relative; flex: 1; overflow: hidden; touch-action: none; background: #050506; }
      .viewport .grid { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 0; background: #050506; }
      .hud { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(9, 9, 11, 0.82); border: 1px solid var(--gold-dim); border-radius: 3px; padding: 0.3rem 0.6rem 0.1rem; }
      .hud-title { font-family: "Cinzel", Georgia, serif; color: var(--gold); font-size: 0.85rem; letter-spacing: 0.06em; text-transform: capitalize; }
      .hud .bar { margin-bottom: 0.15rem; font-size: 0.85rem; }
      .hud .bar span { width: 3.2rem; }
      .hud .track { width: 130px; height: 0.5rem; }
      .pan, .recentre { position: absolute; z-index: 9; width: 30px; height: 30px; padding: 0; border-radius: 50%; background: rgba(9, 9, 11, 0.7); color: var(--gold); border-color: var(--gold-dim); font-size: 0.75rem; }
      .pan-n { top: 6px; left: 50%; transform: translateX(-50%); }
      .pan-s { bottom: calc(var(--handle) + 6px); left: 50%; transform: translateX(-50%); }
      .pan-w { left: 6px; top: 50%; transform: translateY(-50%); }
      .pan-e { right: 6px; top: 50%; transform: translateY(-50%); }
      .recentre { top: 8px; right: 8px; font-size: 1rem; }
      .quick { position: absolute; right: 44px; bottom: calc(var(--handle) + 12px); z-index: 10; display: flex; flex-direction: column; gap: 6px; }
      .quick button { background: rgba(23, 23, 27, 0.92); border-color: var(--gold); color: var(--gold); padding: 0.4rem 0.9rem; font-size: 1rem; }
      .routebar { position: absolute; left: 44px; bottom: calc(var(--handle) + 8px); z-index: 11; max-width: min(520px, calc(50% - 64px)); background: rgba(9, 9, 11, 0.9); border: 1px solid var(--gold-dim); border-radius: 3px; padding: 0.35rem 0.6rem; font-size: 0.92rem; display: flex; flex-direction: column; gap: 0.25rem; }
      .routebar.blocked { border-color: var(--red); }
      .routebar.engaged { flex-direction: row; align-items: center; gap: 0.6rem; border-color: var(--red); }
      .routebtns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      .over { color: #ff7b6b; } .good { color: #8ccf6f; }
      .drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: var(--handle); background: var(--panel); border-top: 1px solid var(--gold-dim); display: flex; flex-direction: column; transition: height 0.18s ease; }
      .drawer.open { height: min(78dvh, 560px); }
      .drawer-handle { flex: none; height: var(--handle); display: flex; align-items: center; gap: 0.7rem; width: 100%; background: none; border: none; border-radius: 0; padding: 0 1rem; color: var(--muted); text-align: left; }
      .drawer-handle .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--gold-dim); flex: none; }
      .drawer-handle .summary { flex: 1; text-transform: capitalize; }
      .drawer-handle .chev { color: var(--gold); }
      .tabs { display: none; gap: 0.2rem; padding: 0 0.6rem; border-bottom: 1px solid var(--line); flex: none; }
      .drawer.open .tabs { display: flex; }
      .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); font-family: "Cinzel", Georgia, serif; font-size: 0.8rem; letter-spacing: 0.06em; padding: 0.45rem 0.7rem; }
      .tab.on { color: var(--gold); border-bottom-color: var(--gold); }
      .drawer-body { display: none; overflow-y: auto; padding: 0.6rem 1rem 1rem; flex: 1; }
      .drawer.open .drawer-body { display: block; }
      .drawer-body .logbox { margin: 0; border: none; }
      .drawer-body .logbox h2 { display: none; }
      .settings { margin-top: 0.8rem; color: var(--muted); font-size: 0.9rem; }
      .settings summary { cursor: pointer; }
      .settings .actions { margin-top: 0.4rem; }
      /* wide screens: the drawer becomes a permanent sidebar */
      @media (min-width: 1000px) and (min-height: 560px) {
        .exp { flex-direction: row; }
        .drawer { position: static; height: auto !important; width: 400px; flex: none; border-top: none; border-left: 1px solid var(--gold-dim); }
        .drawer .tabs { display: flex; padding-top: 0.5rem; }
        .drawer .drawer-body { display: block; }
        .drawer-handle { display: none; }
        :root { --handle: 0px; }
      }

      /* kml: town tabs on narrow screens; side-by-side columns on wide ones */
      .town-tabs { display: flex; margin-top: 0.4rem; }
      .cols.town .tsec { display: none; }
      .cols.town.show-main .tsec[data-tsec="main"], .cols.town.show-bank .tsec[data-tsec="bank"], .cols.town.show-recipes .tsec[data-tsec="recipes"] { display: block; }
      .cols.town .tsec.duo { gap: 1.5rem; }
      .cols.town.show-main .tsec.duo { display: flex; flex-wrap: wrap; align-items: flex-start; }
      .cols.town .tsec.duo > section { flex: 1 1 300px; }
      @media (min-width: 1000px) {
        .town-tabs { display: none; }
        .cols.town .tsec.duo { display: flex; }
        .cols.town .tsec { display: block; }
      }

      /* ===== 9e0 (Muse option 2 + option 1's raft): map legibility ===== */
      .tile.blocked::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: repeating-linear-gradient(45deg, rgba(160, 36, 30, 0.42) 0 2px, transparent 2px 7px); }
      .tile.d1 { filter: brightness(1); }
      .tile.d2 { filter: brightness(0.78); }
      .tile.d3 { filter: brightness(0.58); }
      .tile.fished { filter: saturate(0.35) brightness(0.7); }
      .tile.bobber::after { content: ""; position: absolute; top: 5px; right: 6px; z-index: 2; width: 8px; height: 8px; border-radius: 50%; pointer-events: none;
        background: linear-gradient(#d23a2f 50%, #f1ede2 50%); box-shadow: 0 0 0 1px #000a, 0 2px 3px #000a; }
      .grid.atlas-assets .tile.player.on-raft { background-color: #6b4a2b !important; box-shadow: inset 0 0 0 2px #3a2614, inset 0 -6px 0 #54391f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
